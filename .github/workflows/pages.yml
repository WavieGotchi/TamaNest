# Publishes the web/ folder (installer page + firmware files) to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings > Pages > Source: "GitHub Actions".
# Two jobs, as in GitHub's own Pages template: the deploy job only starts once the upload has finished, plus a short
# pause - with one job, deploy-pages sometimes looked for the upload too early ("No artifacts named github-pages").
name: Installer page
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
